<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#050907"/><rect x="24" y="24" width="1032" height="1872" rx="44" fill="#07130f" stroke="#b7a14a" stroke-width="3"/><text x="72" y="125" fill="#f1d36a" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700">GEMINI LIVE | GUIDED VISION</text><text x="72" y="245" fill="#f5f5f0" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="700">دوربین موبایل را به یک</text><text x="72" y="325" fill="#24e2b0" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="800">دستیار دیداری زنده</text><text x="72" y="405" fill="#f5f5f0" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="700">تبدیل کن</text><line x1="72" y1="445" x2="420" y2="445" stroke="#e5c85e" stroke-width="8"/><text x="72" y="520" fill="#dce5e1" font-family="DejaVu Sans, sans-serif" font-size="30">با Guided Vision در Gemini Live، دوربین را به اشتراک بگذار و</text><text x="72" y="570" fill="#dce5e1" font-family="DejaVu Sans, sans-serif" font-size="30">توضیح صوتی و راهنمای کادربندی لحظه‌ای دریافت کن.</text><rect x="72" y="690" width="936" height="420" rx="30" fill="#081813" stroke="#16a982" stroke-width="3"/><text x="105" y="755" fill="#e8ca5e" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="700">۳ مرحله سریع</text><text x="105" y="825" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="32">۱) Gemini → Live</text><text x="105" y="875" fill="#a8b9b4" font-family="DejaVu Sans, sans-serif" font-size="25">وارد اپلیکیشن Gemini شو و Live را باز کن.</text><text x="105" y="950" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="32">۲) Use Guided Vision in Live</text><text x="105" y="1000" fill="#a8b9b4" font-family="DejaVu Sans, sans-serif" font-size="25">در تنظیمات پروفایل Gemini فعالش کن.</text><text x="105" y="1075" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="32">۳) دوربین را روی متن یا شیء بگیر</text><text x="105" y="1125" fill="#a8b9b4" font-family="DejaVu Sans, sans-serif" font-size="25">سؤال بپرس و پاسخ صوتی لحظه‌ای بگیر.</text><rect x="72" y="1180" width="936" height="300" rx="30" fill="#0a1713" stroke="#d2b955" stroke-width="2"/><text x="105" y="1240" fill="#e8ca5e" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700">مثال کاربردی</text><text x="105" y="1295" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="28">«این متن را بخوان؛ تاریخ انقضا را پیدا کن.»</text><text x="105" y="1360" fill="#e8ca5e" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">Prompt</text><text x="105" y="1410" fill="#dce5e1" font-family="DejaVu Sans, sans-serif" font-size="25">«آنچه دوربین می‌بیند را کوتاه، دقیق و کاربردی</text><text x="105" y="1445" fill="#dce5e1" font-family="DejaVu Sans, sans-serif" font-size="25">توضیح بده و اگر کادر مناسب نیست راهنمایی کن.»</text><text x="72" y="1570" fill="#24e2b0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">نکته:</text><text x="175" y="1570" fill="#e9eee9" font-family="DejaVu Sans, sans-serif" font-size="25">برای متن ریز، برچسب محصول و پیدا کردن اشیا کاربردی است.</text><text x="72" y="1660" fill="#d6dcd8" font-family="DejaVu Sans, sans-serif" font-size="24">Android سازگار • AI DAILY • 04 OCT 2026</text><text x="72" y="1710" fill="#7e918a" font-family="DejaVu Sans, sans-serif" font-size="20">بدون برند SUN</text></svg>