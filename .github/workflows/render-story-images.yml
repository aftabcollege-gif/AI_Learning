name: Render Instagram Images

on:
  push:
    paths:
      - 'stories/**/*.svg'
      - 'posts/**/*.svg'
      - '.github/workflows/render-story-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Render Story SVGs to Instagram JPEG
        run: |
          find stories -type f -name '*.svg' -print0 | while IFS= read -r -d '' f; do
            out="${f%.svg}.jpg"
            rsvg-convert -w 1080 -h 1920 -f png "$f" -o /tmp/story.png
            convert /tmp/story.png -colorspace sRGB -quality 100 -sampling-factor 4:4:4 "$out"
          done

      - name: Render Post SVGs to Instagram JPEG
        run: |
          find posts -type f -name '*.svg' -print0 | while IFS= read -r -d '' f; do
            out="${f%.svg}.jpg"
            rsvg-convert -w 1080 -h 1350 -f png "$f" -o /tmp/post.png
            convert /tmp/post.png -colorspace sRGB -quality 100 -sampling-factor 4:4:4 "$out"
          done

      - name: Validate Instagram media
        run: |
          find stories posts -type f \( -name '*.jpg' -o -name '*.jpeg' \) -print0 | while IFS= read -r -d '' f; do
            identify "$f"
            format=$(identify -format '%m' "$f")
            dimensions=$(identify -format '%wx%h' "$f")
            test "$format" = "JPEG"
            case "$f" in
              stories/*) test "$dimensions" = "1080x1920" ;;
              posts/*) test "$dimensions" = "1080x1350" ;;
            esac
          done

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories posts
          git diff --cached --quiet && exit 0
          git commit -m "Format Instagram media as publish-ready JPEG"
          git push
