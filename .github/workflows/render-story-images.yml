name: Render Story Images

on:
  push:
    paths:
      - 'stories/**/*.svg'
      - '.github/workflows/render-story-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Render SVG to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          find stories -type f -name '*.svg' -print0 | while IFS= read -r -d '' f; do
            out="${f%.svg}.png"
            rsvg-convert -w 1080 -h 1920 "$f" -o "$out"
          done
      - name: Commit rendered PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/**/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Render story images for public media URLs"
          git push
