<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#030807"/><text x="540" y="70" text-anchor="middle" fill="#f5d27a" font-size="28">۱۰ اکتبر ۲۰۲۶</text><text x="540" y="140" text-anchor="middle" fill="#fff" font-size="56">بولتن روزانه هوش مصنوعی</text><g font-family="DejaVu Sans, sans-serif" font-size="27"><rect x="40" y="210" width="1000" height="190" rx="20" fill="#071b17" stroke="#12c6a4"/><text x="990" y="265" text-anchor="end" fill="#f5d27a">عامل‌های خودمختار | Gemini Agent</text><text x="990" y="315" text-anchor="end" fill="#fff" font-size="22">گوگل عامل کاری‌ای معرفی کرده که کارهای چندمرحله‌ای را طی چند روز پیگیری می‌کند.</text><rect x="40" y="430" width="1000" height="190" rx="20" fill="#071b17" stroke="#12c6a4"/><text x="990" y="485" text-anchor="end" fill="#f5d27a">پزشکی | Sakana Namazu</text><text x="990" y="535" text-anchor="end" fill="#fff" font-size="22">مدل ژاپنی در ابزار جست‌وجوی شواهد پزشکی Evidence Finder به کار گرفته شد.</text><rect x="40" y="650" width="1000" height="190" rx="20" fill="#071b17" stroke="#12c6a4"/><text x="990" y="705" text-anchor="end" fill="#f5d27a">خودرو | رانندگی خودکار</text><text x="990" y="755" text-anchor="end" fill="#fff" font-size="22">Daiichi Kotsu و NTT Mobility برای آزمایش خودروهای خودران در ۲۰۲۷ توافق کردند.</text><rect x="40" y="870" width="1000" height="190" rx="20" fill="#071b17" stroke="#12c6a4"/><text x="990" y="925" text-anchor="end" fill="#f5d27a">اپلیکیشن‌ها | EmbeddingGemma 2</text><text x="990" y="975" text-anchor="end" fill="#fff" font-size="22">مدل گوگل جست‌وجوی چندوجهی در تصویر و ویدئو را پشتیبانی می‌کند.</text><text x="540" y="1145" text-anchor="middle" fill="#f5d27a" font-size="24">Anthropic Cyber Mission: تمرکز بر امنیت زیرساخت حیاتی و متن‌باز</text><text x="540" y="1215" text-anchor="middle" fill="#fff" font-size="21">هوافضا و برق: خبر تازه تأییدشده‌ای در بازه امروز پیدا نشد.</text><text x="540" y="1295" text-anchor="middle" fill="#8ad9c7" font-size="19">منابع معتبر • بدون شایعه • بدون برند SUN</text></g></svg>