<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#030807"/><text x="540" y="100" fill="#f3ca64" font-size="48" text-anchor="middle">بولتن روزانه هوش مصنوعی</text><text x="540" y="170" fill="#ffffff" font-size="30" text-anchor="middle">۱۲ اکتبر ۲۰۲۶</text><rect x="40" y="240" width="1000" height="230" rx="20" fill="#073d35" stroke="#14bba5" stroke-width="3"/><text x="980" y="300" fill="#ffffff" font-size="30" text-anchor="end">۱ | ایمنی و قانون‌گذاری AI</text><text x="980" y="365" fill="#e5eee9" font-size="24" text-anchor="end">مایکروسافت خواستار قواعد ایمنی جهانی شد.</text><rect x="40" y="500" width="1000" height="230" rx="20" fill="#073d35" stroke="#14bba5" stroke-width="3"/><text x="980" y="560" fill="#ffffff" font-size="30" text-anchor="end">۲ | اقتصاد و هوش مصنوعی</text><text x="980" y="625" fill="#e5eee9" font-size="24" text-anchor="end">سرمایه‌گذاری AI به رشد کمک می‌کند؛ اشتغال هم تغییر می‌کند.</text><rect x="40" y="760" width="1000" height="230" rx="20" fill="#073d35" stroke="#14bba5" stroke-width="3"/><text x="980" y="820" fill="#ffffff" font-size="30" text-anchor="end">۳ | آینده مشاغل ورودی</text><text x="980" y="885" fill="#e5eee9" font-size="24" text-anchor="end">سنگاپور درباره فرصت‌های شغلی فارغ‌التحصیلان هشدار داد.</text><rect x="40" y="1020" width="1000" height="190" rx="20" fill="#08130f" stroke="#e8c45f" stroke-width="3"/><text x="980" y="1080" fill="#f3ca64" font-size="26" text-anchor="end">خودرو، هوافضا، پزشکی و برق</text><text x="980" y="1140" fill="#e5eee9" font-size="22" text-anchor="end">خبر محصولی تازه با تأیید کافی پیدا نشد.</text><text x="540" y="1290" fill="#8ad5c4" font-size="22" text-anchor="middle">خبرهای تأییدشده | خلاصه تحلیلی فارسی</text></svg>