<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#050807"/>
<g transform="translate(30 0) scale(0.94 1)"><text x="540" y="100" text-anchor="middle" fill="#f5cf69" font-size="34" font-family="DejaVu Sans, sans-serif">۷ اکتبر ۲۰۲۶</text><text x="540" y="165" text-anchor="middle" fill="#fff" font-size="58" font-weight="bold" font-family="DejaVu Sans, sans-serif">بولتن روزانه هوش مصنوعی</text><g font-family="DejaVu Sans, sans-serif" direction="rtl"><text x="980" y="270" text-anchor="start" fill="#62ddc5" font-size="27">۱ | خودرو و رباتیک</text><text x="980" y="315" text-anchor="start" fill="#f6d574" font-size="31" font-weight="bold">مدیرعامل جدید Boston Dynamics</text><text x="980" y="355" text-anchor="start" fill="#eee" font-size="20">Rohit Prasad از امروز مدیرعامل شد؛ تمرکز بیشتر بر AI و رباتیک.</text><text x="980" y="505" text-anchor="start" fill="#62ddc5" font-size="27">۲ | هوافضا و AI</text><text x="980" y="550" text-anchor="start" fill="#f6d574" font-size="31" font-weight="bold">SpaceX و جهش محاسبات AI در فضا</text><text x="980" y="590" text-anchor="start" fill="#eee" font-size="20">گزارش تازه از برنامه تراشه‌های NVIDIA و زیرساخت محاسباتی مداری.</text><text x="980" y="740" text-anchor="start" fill="#62ddc5" font-size="27">۳ | پزشکی و زیست‌شناسی</text><text x="980" y="785" text-anchor="start" fill="#f6d574" font-size="31" font-weight="bold">۱.۸ میلیارد دلار برای AI زیست‌شناسی</text><text x="980" y="825" text-anchor="start" fill="#eee" font-size="20">دولت آمریکا، Google، Meta و Biohub روی داده و مدل‌سازی سلولی کار می‌کنند.</text><text x="980" y="975" text-anchor="start" fill="#62ddc5" font-size="27">۴ | برق و زیرساخت</text><text x="980" y="1020" text-anchor="start" fill="#f6d574" font-size="31" font-weight="bold">رکورد جدید مصرف برق آمریکا</text><text x="980" y="1060" text-anchor="start" fill="#eee" font-size="20">EIA رشد مصرف ۲۰۲۶ و ۲۰۲۷ را پیش‌بینی می‌کند؛ AI محرک مهم است.</text><text x="980" y="1205" text-anchor="start" fill="#62ddc5" font-size="27">۵ | اپلیکیشن‌های کاربردی</text><text x="980" y="1250" text-anchor="start" fill="#f6d574" font-size="29" font-weight="bold">Surface Laptop Ultra؛ اجرای محلی کارهای پیچیده AI</text></g><rect x="70" y="1285" width="940" height="2" fill="#d7ad49"/><text x="540" y="1320" text-anchor="middle" fill="#d7ad49" font-size="17" font-family="DejaVu Sans, sans-serif">منتخب ۲۴ ساعت اخیر • منابع معتبر • بدون برند SUN</text></g>
</svg>