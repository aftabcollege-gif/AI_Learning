<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#020706"/><stop offset="1" stop-color="#07352e"/></linearGradient><linearGradient id="g"><stop stop-color="#00bda8"/><stop offset="1" stop-color="#e7ba56"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#b)"/><g fill="none" stroke="#0ccbb4" opacity=".25"><circle cx="930" cy="100" r="70"/><circle cx="930" cy="100" r="48"/><path d="M0 200H180L230 150H330M780 0L860 70H1080M0 1280H180L240 1220H300"/></g><style>text{font-family:'Noto Sans Arabic','DejaVu Sans',sans-serif;text-anchor:end;direction:rtl}.title{font-size:43px;font-weight:bold;fill:#f5f4ec}.date{font-size:23px;fill:#b8eee5}.head{font-size:28px;font-weight:bold;fill:#edc35e}.body{font-size:23px;fill:#f0f5f2}.source{font-size:16px;fill:#54d9ca}.foot{font-size:18px;fill:#f0f5f2}</style><text x="540" y="82" text-anchor="middle" class="title">بولتن روزانه <tspan fill="#edc35e">هوش مصنوعی</tspan></text><text x="540" y="130" text-anchor="middle" class="date">مهم‌ترین تحولات ۲۴ ساعت اخیر | ۱۳ اکتبر ۲۰۲۶</text><rect x="50" y="158" width="980" height="3" fill="url(#g)"/><g fill="#061411" stroke="#0bbda9" stroke-width="2"><rect x="45" y="185" width="990" height="220" rx="22"/><rect x="45" y="425" width="990" height="220" rx="22"/><rect x="45" y="665" width="990" height="220" rx="22"/><rect x="45" y="905" width="990" height="220" rx="22"/></g><g class="head"><text x="985" y="230">۱ | نظارت جهانی بر AI پیشرفته</text><text x="985" y="470">۲ | زیرساخت محاسباتی اروپا</text><text x="985" y="710">۳ | هوش مصنوعی فیزیکی در صنعت</text><text x="985" y="950">۴ | امنیت مدل‌های هوش مصنوعی</text></g><g class="body"><text x="985" y="275">حدود ۴۰۰ دانشمند خواستار نهاد بین‌المللی</text><text x="985" y="310">برای مهار و گزارش رخدادهای AI پیشرفته شدند.</text><text x="985" y="515">Scaleway برنامه مرکز AI با تراشه‌های NVIDIA</text><text x="985" y="550">در دانمارک و ابررایانه AMD در سوئد را اعلام کرد.</text><text x="985" y="755">Omron توافق خرید OnLogic را به ارزش ۶۷۵</text><text x="985" y="790">میلیون دلار برای تقویت AI صنعتی اعلام کرد.</text><text x="985" y="995">Anthropic می‌گوید محافظت‌های تازه، استخراج داده</text><text x="985" y="1030">برای تقلید Claude را حدود ۹۰ تا ۹۹٪ کاهش داده‌اند.</text></g><g class="source"><text x="985" y="365">منبع: رویترز | ۱۳ اکتبر</text><text x="985" y="605">منبع: رویترز | ۱۳ اکتبر</text><text x="985" y="845">توافق اعلام شده؛ معامله هنوز تکمیل نشده است</text><text x="985" y="1085">ادعای منتشرشده از سوی شرکت</text></g><rect x="45" y="1145" width="990" height="125" rx="18" fill="#07100e" stroke="#b88d3c" stroke-width="2"/><text x="985" y="1190" class="head">خودرو، هوافضا، پزشکی و برق</text><text x="985" y="1230" class="foot">خبر محصولی تازه با تأیید معتبر کافی در این بازه پیدا نشد.</text><text x="540" y="1320" text-anchor="middle" class="date">خلاصه فارسی | خبرهای روز با منابع معتبر</text></svg>