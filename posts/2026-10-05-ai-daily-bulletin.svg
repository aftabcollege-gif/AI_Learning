<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030807"/><stop offset=".55" stop-color="#071714"/><stop offset="1" stop-color="#020303"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#12d7aa"/><stop offset=".5" stop-color="#087967"/><stop offset="1" stop-color="#092b27"/></linearGradient>
<linearGradient id="gold"><stop stop-color="#f7d477"/><stop offset=".5" stop-color="#c69b3b"/><stop offset="1" stop-color="#725219"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<g transform="translate(30 0) scale(0.94 1)">
<circle cx="850" cy="120" r="180" fill="#063a31" opacity=".45" filter="url(#glow)"/>
<circle cx="170" cy="1150" r="180" fill="#25102b" opacity=".25" filter="url(#glow)"/>
<text x="540" y="92" text-anchor="middle" fill="#f4cf6d" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">۴ اکتبر ۲۰۲۶</text>
<text x="540" y="155" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="700">بولتن روزانه هوش مصنوعی</text>
<text x="540" y="198" text-anchor="middle" fill="#9fe7d6" font-family="DejaVu Sans, sans-serif" font-size="24">مهم‌ترین نوآوری‌ها و روندهای قابل‌اتکا در ۲۴ ساعت اخیر</text>
<rect x="60" y="220" width="960" height="3" fill="url(#gold)"/>
<g font-family="DejaVu Sans, sans-serif" direction="rtl">
<g><rect x="45" y="245" width="990" height="190" rx="26" fill="#07110f" stroke="#0ccaa0" stroke-width="2"/>
<rect x="75" y="268" width="170" height="44" rx="22" fill="url(#g)"/><text x="160" y="298" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">خودرو</text>
<text x="995" y="315" text-anchor="end" fill="#f6d77a" font-size="29" font-weight="700">هوش فیزیکی برای کارخانه‌های خودکار</text>
<text x="995" y="358" text-anchor="end" fill="#d9e8e3" font-size="22">هیتاچی و Agile Robots برای توسعه سیستم‌های Physical AI جهت خودکارسازی کارهای پیچیده صنعتی همکاری می‌کنند.</text>
<text x="995" y="397" text-anchor="end" fill="#8edbc9" font-size="18">روند مهم: AI از نرم‌افزار به رباتیک و محیط واقعی می‌رود.</text></g>
<g><rect x="45" y="455" width="990" height="190" rx="26" fill="#07110f" stroke="#0ccaa0" stroke-width="2"/>
<rect x="75" y="478" width="170" height="44" rx="22" fill="url(#g)"/><text x="160" y="508" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">هوافضا</text>
<text x="995" y="525" text-anchor="end" fill="#f6d77a" font-size="29" font-weight="700">پردازش AI در مدار؛ از ایده به آزمایش</text>
<text x="995" y="568" text-anchor="end" fill="#d9e8e3" font-size="22">پروژه‌های محاسبات مداری در حال آزمایش انتقال پردازش داده و مدل‌های AI به ماهواره‌ها هستند.</text>
<text x="995" y="607" text-anchor="end" fill="#8edbc9" font-size="18">هنوز مرحله آزمایشی؛ نه یک فناوری تجاری فراگیر.</text></g>
<g><rect x="45" y="665" width="990" height="190" rx="26" fill="#07110f" stroke="#0ccaa0" stroke-width="2"/>
<rect x="75" y="688" width="170" height="44" rx="22" fill="url(#g)"/><text x="160" y="718" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">پزشکی</text>
<text x="995" y="735" text-anchor="end" fill="#f6d77a" font-size="29" font-weight="700">AI برای تصویر‌برداری سه‌بعدی پزشکی</text>
<text x="995" y="778" text-anchor="end" fill="#d9e8e3" font-size="22">سامانه AI سه‌بعدی IntelliGen در تایوان در حال آزمایش است و هدف آن توسعه استفاده در مراکز پزشکی است.</text>
<text x="995" y="817" text-anchor="end" fill="#8edbc9" font-size="18">کاربرد: تحلیل تصویر و پشتیبانی تصمیم؛ جایگزین پزشک نیست.</text></g>
<g><rect x="45" y="875" width="990" height="190" rx="26" fill="#07110f" stroke="#0ccaa0" stroke-width="2"/>
<rect x="75" y="898" width="170" height="44" rx="22" fill="url(#g)"/><text x="160" y="928" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">برق</text>
<text x="995" y="945" text-anchor="end" fill="#f6d77a" font-size="29" font-weight="700">رشد مراکز داده؛ مسئله جدید شبکه برق</text>
<text x="995" y="988" text-anchor="end" fill="#d9e8e3" font-size="22">رشد ظرفیت مراکز داده AI، اتصال به شبکه، هزینه برق و محدودیت زیرساخت را به موضوعی کلیدی تبدیل کرده است.</text>
<text x="995" y="1027" text-anchor="end" fill="#8edbc9" font-size="18">Reuters: چشم‌انداز رشد مراکز داده آمریکا همچنان قوی است.</text></g>
<g><rect x="45" y="1085" width="990" height="190" rx="26" fill="#07110f" stroke="#0ccaa0" stroke-width="2"/>
<rect x="75" y="1108" width="280" height="44" rx="22" fill="url(#g)"/><text x="215" y="1138" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">عامل‌های خودمختار</text>
<text x="995" y="1155" text-anchor="end" fill="#f6d77a" font-size="29" font-weight="700">عامل‌ها؛ نرم‌افزار از ابزار به اجراکننده</text>
<text x="995" y="1198" text-anchor="end" fill="#d9e8e3" font-size="22">رشد عامل‌های همیشه‌فعال و چندمرحله‌ای، اپلیکیشن‌ها را به سمت اجرای خودکار کارها می‌برد.</text>
<text x="995" y="1237" text-anchor="end" fill="#8edbc9" font-size="18">محور امروز: حریم خصوصی، مجوزها و کنترل کاربر.</text></g>
</g>
<rect x="70" y="1290" width="940" height="2" fill="url(#gold)"/>
<text x="540" y="1325" text-anchor="middle" fill="#a8bcb7" font-family="DejaVu Sans, sans-serif" font-size="17" direction="rtl">منتخب منابع تازه و معتبر • حذف شایعات و خبرهای تکراری • AI_Learning</text>
</g>
</svg>