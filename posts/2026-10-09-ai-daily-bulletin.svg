<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#020606"/><stop offset="1" stop-color="#06251f"/></linearGradient><linearGradient id="g"><stop stop-color="#08d9b4"/><stop offset="1" stop-color="#07564c"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#b)"/>
<g transform="translate(30 0) scale(0.94 1)"><text x="540" y="70" text-anchor="middle" fill="#e8c66b" font-family="DejaVu Sans, sans-serif" font-size="28">۹ اکتبر ۲۰۲۶ • منتخب ۲۴ ساعت اخیر</text><text x="540" y="140" text-anchor="middle" fill="white" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="bold">بولتن روزانه هوش مصنوعی</text><text x="540" y="185" text-anchor="middle" fill="#23d8bd" font-family="DejaVu Sans, sans-serif" font-size="22">خبرهای معتبر • کاربردهای واقعی • ایمنی</text>
<g font-family="DejaVu Sans, sans-serif" direction="rtl"><rect x="38" y="220" width="1004" height="195" rx="22" fill="#061410" stroke="#12c9a9" stroke-width="2"/><text x="995" y="260" text-anchor="start" fill="#26dfc2" font-size="23">خودرو و رباتیک • Reuters، ۹ اکتبر</text><text x="995" y="305" text-anchor="start" fill="#f3d16f" font-size="31" font-weight="bold">چین: AI در خودروهای متصل و ربات‌های انسان‌نما</text><text x="995" y="348" text-anchor="start" fill="#e4eeeb" font-size="22">راهنمای سیاستی تازه ادغام AI در خودروهای برقی متصل و رباتیک را</text><text x="995" y="380" text-anchor="start" fill="#e4eeeb" font-size="22">تشویق می‌کند؛ کنترل ریسک و نظارت نیز در اولویت است.</text><text x="995" y="402" text-anchor="start" fill="#9db8b1" font-size="17">جهت‌گیری سیاستی است، نه قابلیت تجاری تازه.</text>
<rect x="38" y="430" width="1004" height="195" rx="22" fill="#061410" stroke="#12c9a9" stroke-width="2"/><text x="995" y="470" text-anchor="start" fill="#26dfc2" font-size="23">هوافضا و پهپادها • Reuters، ۹ اکتبر</text><text x="995" y="515" text-anchor="start" fill="#f3d16f" font-size="31" font-weight="bold">اقتصاد ارتفاع پایین؛ پهپاد و تاکسی هوایی</text><text x="995" y="558" text-anchor="start" fill="#e4eeeb" font-size="22">چین توسعه پهپادهای غیرنظامی و تاکسی‌های هوایی را تشویق</text><text x="995" y="590" text-anchor="start" fill="#e4eeeb" font-size="22">می‌کند و هم‌زمان بر ایمنی و مدیریت ریسک تأکید دارد.</text><text x="995" y="612" text-anchor="start" fill="#9db8b1" font-size="17">سیاست‌گذاری، نه اعلام بهره‌برداری تجاری.</text>
<rect x="38" y="640" width="1004" height="195" rx="22" fill="#061410" stroke="#12c9a9" stroke-width="2"/><text x="995" y="680" text-anchor="start" fill="#26dfc2" font-size="23">پزشکی و صنعت • HCLTech، ۸ اکتبر</text><text x="995" y="725" text-anchor="start" fill="#f3d16f" font-size="31" font-weight="bold">۲۰ راهکار تخصصی AI برای صنایع مختلف</text><text x="995" y="768" text-anchor="start" fill="#e4eeeb" font-size="22">راهکارهایی برای سلامت، ایمنی دارو، هوافضا، تحرک، انرژی و</text><text x="995" y="800" text-anchor="start" fill="#e4eeeb" font-size="22">تولید معرفی شده‌اند؛ برخی عملیاتی و برخی در مراحل اولیه‌اند.</text><text x="995" y="822" text-anchor="start" fill="#9db8b1" font-size="17">اعداد عملکردی اعلام‌شده، ادعای شرکت هستند.</text>
<rect x="38" y="850" width="1004" height="195" rx="22" fill="#061410" stroke="#12c9a9" stroke-width="2"/><text x="995" y="890" text-anchor="start" fill="#26dfc2" font-size="23">برق و مراکز داده • Axios، ۸ اکتبر</text><text x="995" y="935" text-anchor="start" fill="#f3d16f" font-size="31" font-weight="bold">پیشنهاد تازه درباره هزینه برق مراکز داده AI</text><text x="995" y="978" text-anchor="start" fill="#e4eeeb" font-size="22">پیشنهاد قانونی آمریکا بر سهم مراکز داده از هزینه زیرساخت و</text><text x="995" y="1010" text-anchor="start" fill="#e4eeeb" font-size="22">اثر رشد تقاضای برق تمرکز دارد؛ هنوز قانون نهایی نیست.</text><text x="995" y="1032" text-anchor="start" fill="#9db8b1" font-size="17">ظرفیت اتصال و هزینه توسعه شبکه اهمیت بیشتری می‌یابد.</text>
<rect x="38" y="1060" width="1004" height="210" rx="22" fill="#061410" stroke="#12c9a9" stroke-width="2"/><text x="995" y="1100" text-anchor="start" fill="#26dfc2" font-size="23">عامل‌های خودمختار و ایمنی • Reuters، ۹ اکتبر</text><text x="995" y="1145" text-anchor="start" fill="#f3d16f" font-size="30" font-weight="bold">۳٫۶٪ از انتشارهای مدل بررسی‌شده، آزمون ایمنی عمومی داشتند</text><text x="995" y="1188" text-anchor="start" fill="#e4eeeb" font-size="22">از ۸۵۷ انتشار مدل چینی، ۳۱ مورد ارزیابی اختصاصی را علنی</text><text x="995" y="1220" text-anchor="start" fill="#e4eeeb" font-size="22">کرده‌اند؛ نبود افشا لزوماً یعنی نبود آزمون نیست.</text><text x="995" y="1248" text-anchor="start" fill="#9db8b1" font-size="17">عامل‌های توانمندتر به ارزیابی و نظارت شفاف نیاز دارند.</text></g><path d="M40 1292H1040" stroke="#d8b95b" stroke-width="2"/><text x="540" y="1325" text-anchor="middle" fill="#e8c66b" font-family="DejaVu Sans, sans-serif" font-size="19">منابع معتبر • حذف شایعات • خلاصه آموزشی روزانه</text></g>
</svg>